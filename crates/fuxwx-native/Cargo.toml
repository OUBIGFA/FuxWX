[package]
name = "fuxwx-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "MIT"

[workspace]

[features]
default = ["native"]
native = ["dep:nsh-core"]

[dependencies]
nsh-core = { version = "=0.7.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"
trash = "5.4"
base64 = "0.23"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_UI_Shell", "Win32_System_Com", "Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
